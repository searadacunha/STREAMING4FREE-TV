[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv4free"
version = "0.4.0"
description = "Free IPTV automation for Android TV, built around Kodi: playlist validation, channel organization, EPG mapping and safe deployment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
iptv4free = "iptv4free.cli:main"

[project.urls]
Source = "https://github.com/searadacunha/IPTV4FREE"

[tool.pytest.ini_options]
testpaths = ["tests"]
