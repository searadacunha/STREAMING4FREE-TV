plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iptv4free.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iptv4free.launcher'
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName '0.1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
