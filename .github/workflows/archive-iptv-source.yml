# One-time preservation of IPTV4FREE's additional branch snapshots.
# The stable and TV preview histories already exist in main via git subtree.
name: Preserve unmerged IPTV4FREE histories
on:
  push:
    branches: [archive/iptv-source-transfer-20261113]
    paths: ['.github/workflows/archive-iptv-source.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve branch contents under non-workflow archive paths, retaining ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add iptv-source https://github.com/searadacunha/IPTV4FREE.git
          git fetch --no-tags iptv-source '+refs/heads/*:refs/remotes/iptv-source/*'
          declare -A EXPECTED=(
            [main]=01b860c3b02990703956c24cffeeda00a8be68d0
            [meganexus]=bf36778c3fcf253aa7fa4679ea9fbeb8c4d44974
            [fix/lineup-and-parser-bugs]=b6ae645de2fe01b21a4177fe9213758bf592f2f5
            [fix/readme-launcher-download-link]=6669bebe572e7e39d92138dc66cb6dfee3b86cdc
            [feat/iptv4free-tv-ui]=dad35d2d12fafda1875ff1afa931bc47f3813a85
            [feat/iptv4free-playback-stability]=cf9a9dcae1ac42deb9cc6bb265d8151ecaf8ecf3
          )
          for name in "${!EXPECTED[@]}"; do
            actual="$(git rev-parse "refs/remotes/iptv-source/$name")"
            [[ "$actual" == "${EXPECTED[$name]}" ]] || { echo "Source changed: $name" >&2; exit 1; }
          done
          # main and TV UI are already imported as Git subtree parents on main.
          # These four remaining snapshots include every known unmerged branch.
          for item in \
            "meganexus|meganexus" \
            "fix/lineup-and-parser-bugs|fix-lineup-and-parser-bugs" \
            "fix/readme-launcher-download-link|fix-readme-launcher-download-link" \
            "feat/iptv4free-playback-stability|feat-iptv4free-playback-stability"; do
            src="${item%%|*}"
            target="${item##*|}"
            git subtree add --prefix="source-archive/iptv4free/$target" \
              "refs/remotes/iptv-source/$src" \
              -m "Archive IPTV4FREE branch $src with Git ancestry"
          done
          mkdir -p source-archive/iptv4free
          {
            echo "# IPTV4FREE source history archive"
            echo
            echo "These Git snapshots preserve the branches that existed before consolidating into STREAMING4FREE-TV."
            echo "The original stable main and feat/iptv4free-tv-ui are integrated into main under iptv/ and iptv-tv-preview/."
            echo
            for name in "${!EXPECTED[@]}"; do
              printf '%s %s\n' "${EXPECTED[$name]}" "$name"
            done | sort
            echo
            echo "Archived Git tree snapshots retain source ancestry. GitHub PR comments, issues, and repository settings are not exported."
          } > source-archive/iptv4free/BRANCHES.md
          git add source-archive/iptv4free/BRANCHES.md
          git commit -m "Record source branches and SHA-1 identities"
          git push origin HEAD:refs/heads/archive/iptv-source-transfer-20261113
          echo "Preserved all six known Git histories and snapshots on the archival branch."
