name: PES 2006 Android TV APK
on:
  workflow_dispatch:
  push:
    paths:
      - "pes6/**"
      - ".github/workflows/pes6-tv.yml"
  pull_request:
    paths:
      - "pes6/**"
      - ".github/workflows/pes6-tv.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK and logo renderer
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
          python3 -m pip install --user Pillow
      - name: Test controller mapping
        run: node pes6/test/test_gamepad.js
      - name: Build APK
        run: |
          cd pes6
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pes2006-android-tv-apk
          path: pes6/build/pes2006-tv-1.0.apk
          if-no-files-found: error
