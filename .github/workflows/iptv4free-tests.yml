name: IPTV4FREE integration checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'iptv/**'
      - 'iptv-tv-preview/**'
      - '.github/workflows/iptv4free-tests.yml'
  push:
    branches: [main]
    paths:
      - 'iptv/**'
      - 'iptv-tv-preview/**'
      - '.github/workflows/iptv4free-tests.yml'
permissions:
  contents: read

jobs:
  stable-iptv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test stable IPTV automation
        working-directory: iptv
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          iptv4free --help
          python scripts/benchmark.py 2000

  kodi-and-launcher-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and package the preserved Kodi TV preview
        working-directory: iptv-tv-preview
        run: |
          python -m pip install pytest pillow
          python -m pytest -q tests/test_tv_ui.py tests/test_android_launcher.py
          python scripts/build_addon.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          zips = list(Path("dist").glob("script.iptv4free-*.zip"))
          assert len(zips) == 1
          with ZipFile(zips[0]) as z:
              assert z.testzip() is None
              assert "script.iptv4free/addon.xml" in z.namelist()
          print("Verified preview ZIP:", zips[0])
          PY

  iptv-android-launcher-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build IPTV4FREE Android launcher from imported source
        working-directory: iptv-tv-preview
        run: |
          python -m pip install pillow pytest
          python scripts/prepare_android_launcher.py
          python -m pytest -q tests/test_android_launcher.py
          cd android-tv-launcher
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV4FREE-debug-launcher
          path: iptv-tv-preview/android-tv-launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
